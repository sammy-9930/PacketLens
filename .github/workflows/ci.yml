name: PacketLens CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install test and benchmark libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtest-dev libgmock-dev libbenchmark-dev
      - name: Build and test
        run: make -j2 all test sniffer-benchmark
      - name: Verify PCAP replay
        run: python3 tests/check_pcap_replay.py
      - name: Verify the bundled demo trace
        run: |
          python3 demo/generate_trace.py
          git diff --exit-code -- demo/trace.js
      - name: Build Linux CLI package
        run: make package
      - name: Upload Linux CLI package
        uses: actions/upload-artifact@v7
        with:
          path: build/packetlens-linux-x86_64.tar.gz
          archive: false
          if-no-files-found: error
      - name: Package dashboard
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p build/pages
          cp demo/index.html demo/style.css demo/replay.js demo/trace.js build/pages/
          cp docs/benchmark-report.html build/pages/
      - name: Upload dashboard
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/pages

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    concurrency:
      group: github-pages
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v4
